name: Release
permissions:
  contents: read
on:
  workflow_dispatch: # This is a manual trigger
  release:
    types:
      - created

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        working-directory: nadag-innmelding-python-client
        run: |
          uv build
          uv publish
