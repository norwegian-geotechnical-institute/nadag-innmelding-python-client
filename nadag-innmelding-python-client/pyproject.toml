[project]
name = "nadag-innmelding-python-client"
version = "2026.09.07"
description = "A client library for accessing Nadag innmelding API"
license = "MIT"
authors = [
    { name = "Jiyang Ye", email = "jiyang.ye@ngi.no" },
]
maintainers = [
    { name = "Jiyang Ye", email = "jiyang.ye@ngi.no" },
    { name = "Jostein Leira", email = "jostein.leira@ngi.no" },
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "httpx>=0.20.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0,<3",
]

[tool.uv.build-backend]
module-name = "nadag_innmelding_python_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
